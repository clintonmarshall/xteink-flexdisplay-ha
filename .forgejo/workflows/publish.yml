name: Publish protected software-only release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify release controls only, or publish after verification
        required: true
        default: verify-only
        type: choice
        options:
          - verify-only
          - publish
      version:
        description: Exact X.Y.Z platform version
        required: true
        type: string
      commit_sha:
        description: Exact fully tested main commit SHA
        required: true
        type: string
      classification:
        description: Release classification
        required: true
        type: choice
        options:
          - software-only
      promotion_confirmation:
        description: "Exact phrase: promote vX.Y.Z at FULL_SHA"
        required: false
        type: string
      publication_confirmation:
        description: "Exact phrase: publish vX.Y.Z at FULL_SHA"
        required: false
        type: string

concurrency:
  group: flexdisplay-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: trusted-release
    env:
      FORGEJO_ORIGIN: ${{ forgejo.server_url }}
      FORGEJO_REPOSITORY: ${{ forgejo.repository }}
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      RELEASE_TAG: v${{ inputs.version }}
      RELEASE_SHA: ${{ inputs.commit_sha }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha }}
      - name: Install release validation toolchain
        run: >-
          apt-get update &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y
          --no-install-recommends nodejs python3-venv &&
          rm -rf /var/lib/apt/lists/*
      - name: Revalidate exact software-only commit
        run: |
          test "$(python3 scripts/check_release_metadata.py --print-version)" = "${{ inputs.version }}"
          python3 scripts/check_release_metadata.py --release "${{ inputs.version }}"
          python3 scripts/check_firmware_release.py --classification "${{ inputs.classification }}"
          python3 scripts/check_studio_javascript.py
          python3 -m compileall -q flexdisplay_bridge/flexdisplay_bridge \
            flexdisplay_bridge/app_runner.py custom_components/flexdisplay scripts
          python3 -m venv /tmp/flexdisplay-release-venv
          /tmp/flexdisplay-release-venv/bin/python -m pip install --upgrade pip build
          /tmp/flexdisplay-release-venv/bin/python -m pip install -e './flexdisplay_bridge[test]'
          (cd flexdisplay_bridge && /tmp/flexdisplay-release-venv/bin/python -m pytest tests)
          /tmp/flexdisplay-release-venv/bin/python -m build --wheel \
            --outdir /tmp/flexdisplay-dist flexdisplay_bridge
          git diff --check
      - name: Verify Forgejo controls without mutation
        run: >-
          python3 scripts/publish_release.py
          --mode dry-run
          --tag "$RELEASE_TAG"
          --commit-sha "$RELEASE_SHA"
          --classification "${{ inputs.classification }}"
      - name: Promote protected immutable tag
        if: ${{ inputs.operation == 'publish' }}
        run: >-
          python3 scripts/publish_release.py
          --mode tag-only
          --tag "$RELEASE_TAG"
          --commit-sha "$RELEASE_SHA"
          --classification "${{ inputs.classification }}"
          --confirmation "${{ inputs.promotion_confirmation }}"

  publish:
    if: ${{ inputs.operation == 'publish' }}
    needs: promote
    runs-on: trusted-release
    env:
      FORGEJO_ORIGIN: ${{ forgejo.server_url }}
      FORGEJO_REPOSITORY: ${{ forgejo.repository }}
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      GITHUB_RELEASE_DISPATCH_TOKEN: ${{ secrets.GITHUB_RELEASE_DISPATCH_TOKEN }}
      RELEASE_TAG: v${{ inputs.version }}
      RELEASE_SHA: ${{ inputs.commit_sha }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: v${{ inputs.version }}
      - name: Verify protected tag checkout
        run: |
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          python3 scripts/check_release_metadata.py --release "${{ inputs.version }}"
          python3 scripts/check_firmware_release.py --classification "${{ inputs.classification }}"
      - name: Publish authoritative Forgejo release
        run: >-
          python3 scripts/publish_release.py
          --mode release-only
          --tag "$RELEASE_TAG"
          --commit-sha "$RELEASE_SHA"
          --classification "${{ inputs.classification }}"
          --confirmation "${{ inputs.publication_confirmation }}"
      - name: Dispatch downstream GitHub compatibility release
        run: >-
          python3 scripts/dispatch_github_release.py
          --tag "$RELEASE_TAG"
          --commit-sha "$RELEASE_SHA"
