name: Promote protected release tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      commit:
        description: Exact fully validated current main commit SHA
        required: true
        type: string
      confirmation:
        description: Type promote-vX.Y.Z-at-FULL_SHA after separate approval
        required: true
        type: string

enable-openid-connect: true

concurrency:
  group: flexdisplay-release-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ forgejo.actor == forgejo.repository_owner }}
    runs-on: trusted-release
    env:
      RELEASE_TAG: v${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      FORGEJO_API_URL: ${{ forgejo.api_url }}
      FORGEJO_REPOSITORY: ${{ forgejo.repository }}
    steps:
      - name: Require reviewed release infrastructure
        shell: bash
        env:
          AUTOMATION_ENABLED: ${{ vars.FLEXDISPLAY_RELEASE_AUTOMATION_ENABLED }}
          RUNNER_ISOLATED: ${{ vars.FLEXDISPLAY_RELEASE_RUNNER_ISOLATED }}
          CREDENTIAL_PATH_APPROVED: ${{ vars.FLEXDISPLAY_RELEASE_CREDENTIAL_PATH_APPROVED }}
          AUTH_AUDIENCE: ${{ vars.FLEXDISPLAY_RELEASE_PROMOTION_AUDIENCE }}
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          test "$AUTOMATION_ENABLED" = "true"
          test "$RUNNER_ISOLATED" = "true"
          test "$CREDENTIAL_PATH_APPROVED" = "true"
          test -n "$AUTH_AUDIENCE"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$RELEASE_CONFIRMATION" = "promote-$RELEASE_TAG-at-$RELEASE_COMMIT"

      - name: Check out exact reviewed main candidate
        # actions/checkout v6, reviewed 2026-08-13
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Verify local release metadata before requesting authority
        shell: bash
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse origin/main)" = "$RELEASE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 scripts/check_release_metadata.py --release "${RELEASE_TAG#v}"
          python3 scripts/check_android_release_metadata.py --require-signer

      - name: Acquire one-run promotion authority
        id: release-auth
        shell: bash
        env:
          AUTH_AUDIENCE: ${{ vars.FLEXDISPLAY_RELEASE_PROMOTION_AUDIENCE }}
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
          http_proxy: ""
          https_proxy: ""
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
        run: |
          set -euo pipefail
          umask 077
          auth_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/flexdisplay-release-auth.XXXXXX")"
          response="$auth_dir/oidc.json"
          token_file="$auth_dir/release.jwt"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUTH_AUDIENCE" > "$response"
          RESPONSE_FILE="$response" TOKEN_FILE="$token_file" python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          response = json.loads(Path(os.environ["RESPONSE_FILE"]).read_text())
          token = response.get("value")
          if not isinstance(token, str) or not token or "\n" in token or "\r" in token:
              raise SystemExit("Forgejo did not issue a safe one-run release JWT")
          Path(os.environ["TOKEN_FILE"]).write_text(token, encoding="utf-8")
          PY
          : > "$response"
          rm -f -- "$response"
          chmod 600 "$token_file"
          echo "::add-mask::$(<"$token_file")"
          echo "token_file=$token_file" >> "$FORGEJO_OUTPUT"
          echo "auth_dir=$auth_dir" >> "$FORGEJO_OUTPUT"

      - name: Create protected annotated tag and draft Forgejo release
        shell: bash
        env:
          FLEXDISPLAY_RELEASE_TOKEN_FILE: ${{ steps.release-auth.outputs.token_file }}
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          python3 scripts/forgejo_release.py promote \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --confirmation "$RELEASE_CONFIRMATION" \
            --token-file "$FLEXDISPLAY_RELEASE_TOKEN_FILE" \
            --api-url "$FORGEJO_API_URL"

      - name: Remove one-run promotion authority
        if: ${{ always() }}
        shell: bash
        env:
          AUTH_DIR: ${{ steps.release-auth.outputs.auth_dir }}
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -eu
          if [ -n "$AUTH_DIR" ] && [ -d "$AUTH_DIR" ]; then
            find "$AUTH_DIR" -depth -type f -exec sh -c ': > "$1"; rm -f -- "$1"' sh {} \;
            find "$AUTH_DIR" -depth -type d -exec rmdir {} \;
          fi
