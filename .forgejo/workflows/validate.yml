name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  bridge:
    runs-on: linux-amd64
    steps:
      # actions/checkout v6
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate release metadata
        run: python3 scripts/check_release_metadata.py
      - name: Install Python toolchain
        run: >-
          apt-get update &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y
          --no-install-recommends python3-venv &&
          rm -rf /var/lib/apt/lists/*
      - name: Install bridge
        working-directory: flexdisplay_bridge
        run: >-
          python3 -m venv /tmp/flexdisplay-venv &&
          /tmp/flexdisplay-venv/bin/python -m pip install -e '.[test]'
      - name: Test bridge
        working-directory: flexdisplay_bridge
        run: /tmp/flexdisplay-venv/bin/python -m pytest tests
      - name: Compile Python sources
        run: >-
          python3 -m compileall -q
          flexdisplay_bridge/flexdisplay_bridge
          flexdisplay_bridge/app_runner.py
          custom_components/flexdisplay
