name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: linux-amd64
    steps:
      # actions/checkout v6
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install validation toolchain
        run: >-
          apt-get update &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y
          --no-install-recommends nodejs python3-venv &&
          rm -rf /var/lib/apt/lists/*
      - name: Validate release metadata and firmware classification
        run: |
          python3 scripts/check_release_metadata.py
          python3 scripts/check_studio_javascript.py
          if [ -n "$(git tag --merged HEAD --sort=-version:refname 'v*' | head -1)" ]; then
            python3 scripts/check_firmware_release.py
          fi
      - name: Build non-editable Bridge wheel
        run: |
          python3 -m venv /tmp/flexdisplay-venv
          /tmp/flexdisplay-venv/bin/python -m pip install --upgrade pip build
          /tmp/flexdisplay-venv/bin/python -m build --wheel \
            --outdir /tmp/flexdisplay-dist flexdisplay_bridge
          /tmp/flexdisplay-venv/bin/python -m pip install \
            '/tmp/flexdisplay-dist/'*.whl \
            'pytest>=8.0' 'fastapi[standard]>=0.115.0' 'httpx<0.28' \
            'paho-mqtt>=2.1.0' 'Pillow>=10.0.0' 'qrcode>=8.0' \
            'PyYAML>=6.0.0' 'pytest-asyncio>=0.23.0'
      - name: Test Bridge
        run: >-
          PYTHONPATH="$PWD/flexdisplay_bridge"
          /tmp/flexdisplay-venv/bin/python -m pytest flexdisplay_bridge/tests
      - name: Compile Python sources
        run: >-
          python3 -m compileall -q
          flexdisplay_bridge/flexdisplay_bridge
          flexdisplay_bridge/app_runner.py
          custom_components/flexdisplay scripts
      - name: Validate patch formatting
        run: git diff --check HEAD^

  app:
    runs-on: linux-amd64
    steps:
      # actions/checkout v6
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build Home Assistant App image
        run: |
          BUILD_VERSION="$(python3 scripts/check_release_metadata.py --print-version)"
          docker build \
            --build-arg BUILD_VERSION="$BUILD_VERSION" \
            --build-arg BUILD_ARCH=amd64 \
            flexdisplay_bridge
