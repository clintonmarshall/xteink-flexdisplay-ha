preview_top52810_image:
  name: Preview TOP52810 image
  description: Preview a PNG/JPEG file under /media, or a native base64 PNG, for the experimental F6ED tag without Bluetooth writes.
  fields:
    image_base64:
      name: PNG image (base64)
      description: Raw base64 PNG, at most 128 KiB decoded. No URL or data URI. Transparency is composited onto white.
      selector:
        text:
          multiline: true
    image_file:
      name: Image file
      description: Absolute HA path under /media, e.g. /media/dog.jpg. PNG/JPEG up to 5 MiB and 12 megapixels. Choose this OR base64.
      selector:
        text:
    resize_mode:
      name: Layout
      default: fit
      selector:
        select:
          options:
            - label: Fit (white padding)
              value: fit
            - label: Crop (fill screen)
              value: crop
    config_entry_id:
      name: FlexDisplay config entry
      selector:
        text:
send_top52810_image:
  name: Send TOP52810 image
  description: Overwrite experimental tag DF:84:6B:DE:F6:ED once with a previewed image. Requires the preview plan hash. Stock hatch bands may remain; acknowledgement is not visual verification.
  fields:
    image_base64:
      name: PNG image (base64)
      description: Exactly the same base64 PNG used for the preview.
      selector:
        text:
          multiline: true
    image_file:
      name: Image file
      description: Same /media PNG/JPEG and layout used for preview. Changed rendered pixels are rejected. Choose this OR base64.
      selector:
        text:
    resize_mode:
      name: Layout
      default: fit
      selector:
        select:
          options:
            - label: Fit (white padding)
              value: fit
            - label: Crop (fill screen)
              value: crop
    expected_plan_sha256:
      name: Confirmed preview plan SHA-256
      required: true
      selector:
        text:
    config_entry_id:
      name: FlexDisplay config entry
      selector:
        text:
send_meshtastic_message:
  name: Send Meshtastic message
  description: Send a broadcast or direct text message through the SenseCAP FlexHub.
  fields:
    text:
      name: Message
      description: Text to send, up to 220 UTF-8 bytes.
      required: true
      example: "Showroom closes at 17:00"
      selector:
        text:
          multiline: true
    destination:
      name: Destination
      description: Use broadcast or a Meshtastic node ID such as !12345678.
      default: broadcast
      selector:
        text:
    channel:
      name: Channel
      description: Meshtastic channel index from 0 to 7.
      default: 0
      selector:
        number:
          min: 0
          max: 7
          mode: box
    request_ack:
      name: Request acknowledgement
      description: Ask a direct recipient for a delivery acknowledgement.
      default: false
      selector:
        boolean:
    config_entry_id:
      name: Config entry ID
      description: Optional FlexDisplay config entry when more than one Bridge is installed.
      selector:
        config_entry:
          integration: flexdisplay

clear_meshtastic_unread:
  name: Clear Meshtastic unread count
  description: Reset the local unread-message counter for the SenseCAP FlexHub.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional FlexDisplay config entry when more than one Bridge is installed.
      selector:
        config_entry:
          integration: flexdisplay

notify:
  name: Send display notification
  description: Show an interactive alert on an Android FlexDisplay receiver such as an Echo Spot.
  fields:
    device_id:
      name: Display ID
      description: FlexDisplay receiver ID, for example ROOK-SPOT01.
      required: true
      selector:
        text:
    title:
      name: Title
      required: true
      selector:
        text:
    message:
      name: Message
      selector:
        text:
          multiline: true
    camera_entity:
      name: Camera
      description: Optional Home Assistant camera snapshot to display.
      selector:
        entity:
          domain: camera
    chime:
      name: Chime
      default: default
      selector:
        select:
          options:
            - none
            - default
            - doorbell
            - alert
    duration:
      name: Display duration
      default: 20
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: s
          mode: box
    actions:
      name: Action buttons
      description: Up to three allowlisted Home Assistant action objects.
      example:
        - label: Porch light
          service: light.turn_on
          entity_id: light.porch
      selector:
        object:
    config_entry_id:
      name: Config entry ID
      selector:
        config_entry:
          integration: flexdisplay
