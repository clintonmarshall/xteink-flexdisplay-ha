name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: flexdisplay_bridge/pyproject.toml
      - name: Install bridge
        working-directory: flexdisplay_bridge
        run: python -m pip install -e '.[test]'
      - name: Test bridge
        working-directory: flexdisplay_bridge
        run: python -m pytest tests
      - name: Compile Python sources
        working-directory: flexdisplay_bridge
        run: >-
          python -m compileall -q
          flexdisplay_bridge
          app_runner.py
          ../custom_components/flexdisplay

  app:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build Home Assistant App image
        run: |
          BUILD_VERSION="$(python3 scripts/check_release_metadata.py --print-version)"
          docker build \
            --build-arg BUILD_VERSION="$BUILD_VERSION" \
            --build-arg BUILD_ARCH=amd64 \
            flexdisplay_bridge

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        # hacs/action main observed 2026-08-13
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          ignore: brands

  hassfest:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # home-assistant/actions hassfest master observed 2026-08-13
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb
