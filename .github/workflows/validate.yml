name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: flexdisplay_bridge/pyproject.toml
      - name: Install bridge
        working-directory: flexdisplay_bridge
        run: python -m pip install -e '.[test]'
      - name: Test bridge
        working-directory: flexdisplay_bridge
        run: python -m pytest tests
      - name: Compile Python sources
        working-directory: flexdisplay_bridge
        run: >-
          python -m compileall -q
          flexdisplay_bridge
          app_runner.py
          ../custom_components/flexdisplay

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Home Assistant App image
        run: >-
          docker build
          --build-arg BUILD_VERSION=0.12.0
          --build-arg BUILD_ARCH=amd64
          flexdisplay_bridge

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
