name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: flexdisplay_bridge/pyproject.toml
      - name: Install bridge
        working-directory: flexdisplay_bridge
        run: python -m pip install -e '.[test]'
      - name: Test bridge
        working-directory: flexdisplay_bridge
        run: python -m pytest tests
      - name: Compile Python sources
        working-directory: flexdisplay_bridge
        run: >-
          python -m compileall -q
          flexdisplay_bridge
          app_runner.py
          ../custom_components/flexdisplay

  app:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build Home Assistant App image
        run: |
          BUILD_VERSION="$(python3 scripts/check_release_metadata.py --print-version)"
          docker build \
            --build-arg BUILD_VERSION="$BUILD_VERSION" \
            --build-arg BUILD_ARCH=amd64 \
            flexdisplay_bridge

  hacs:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run exact-checkout content-addressed HACS source validation
        run: |
          set -eu
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONPATH=/hacs \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            --entrypoint python3 \
            ghcr.io/hacs/action@sha256:41f6310585d9fb72c7a0e183cce0594355715bc24112b62bc4279b83412edccb \
            scripts/check_hacs_local.py
      - name: Run full HACS repository validation on the mirrored commit
        env:
          INPUT_CATEGORY: integration
          INPUT_COMMENT: "false"
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_REPOSITORY: clintonmarshall/xteink-flexdisplay-ha
          REPOSITORY_REF: ${{ github.sha }}
        run: |
          set -eu
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --env INPUT_CATEGORY \
            --env INPUT_COMMENT \
            --env INPUT_GITHUB_TOKEN \
            --env INPUT_REPOSITORY \
            --env REPOSITORY_REF \
            ghcr.io/hacs/action@sha256:41f6310585d9fb72c7a0e183cce0594355715bc24112b62bc4279b83412edccb

  hassfest:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run content-addressed hassfest container
        run: |
          set -eu
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --volume "$GITHUB_WORKSPACE:/github/workspace:ro" \
            ghcr.io/home-assistant/hassfest@sha256:8cd7bdb8f82430c2c13703290b1fc38dcc99957dd76ad3f230035ecee70b672d
