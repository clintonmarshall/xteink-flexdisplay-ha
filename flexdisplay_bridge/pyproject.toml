[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flexdisplay-ha-bridge"
version = "0.40.0"
description = "Home Assistant renderer and fleet bridge for FlexDisplay X3/X4 devices"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "paho-mqtt>=2,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "qrcode>=8,<9",
  "requests>=2.31,<3",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=14,<16",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
flexdisplay-ha-bridge = "flexdisplay_bridge.main:main"

[tool.setuptools.packages.find]
include = ["flexdisplay_bridge*"]

[tool.setuptools.package-data]
flexdisplay_bridge = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
