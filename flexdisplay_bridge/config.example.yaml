server:
  # Set FLEXDISPLAY_BRIDGE_API_KEY to protect command endpoints.
  api_key_env: FLEXDISPLAY_BRIDGE_API_KEY

storage:
  state_path: /data/flexdisplay-state.json

provisioning:
  enabled: true
  default_area: ""
  default_mode: home_assistant
  auto_start: true
  refresh_interval_seconds: 900
  live_mode: false
  manual_sleep_seconds: 900
  intelligent_sleep: true
  active_start: "06:00"
  active_end: "22:00"
  timezone: Australia/Melbourne
  critical_battery_percent: 15
  low_battery_percent: 35
  low_battery_multiplier: 4
  unchanged_image_multiplier: 2
  stay_awake_on_usb: true
  manual_wake_grace_seconds: 60
  # standard is fastest; photo enables the experimental X4 full-refresh path.
  rendering_profile: standard

home_assistant:
  base_url: http://homeassistant.local:8123
  token_env: FLEXDISPLAY_HA_TOKEN
  verify_tls: false
  timeout_seconds: 10

mqtt:
  # Enable after the bridge can render a screen successfully.
  enabled: false
  host: core-mosquitto
  port: 1883
  username: flexdisplay
  password_env: FLEXDISPLAY_MQTT_PASSWORD
  discovery_prefix: homeassistant
  topic_prefix: flexdisplay
  # "hacs" avoids duplicate entities for existing integration users.
  # Choose "mqtt" for the v0.20 App-only installation, or "both" for testing.
  entity_source: hacs

screen_history:
  enabled: true
  limit: 5

firmware:
  # Application image used by queued Home Assistant OTA installs.
  version: ""
  url: ""
  sha256: ""
  size: 0
  minimum_battery_percent: 40
  canary_required: true
  require_usb_for_canary: true
  max_parallel: 1
  retry_limit: 3
  retry_backoff_seconds: 300
  mirror_enabled: true
  mirror_retry_seconds: 300
  stale_install_seconds: 1800
  maintenance_window_enabled: false
  maintenance_start: "01:00"
  maintenance_end: "05:00"
  maintenance_timezone: Australia/Melbourne
  maintenance_usb_override: true

dashboard:
  title: HOME ASSISTANT
  default_profile: default
  # Add entity IDs that exist in your Home Assistant. For example:
  # entities:
  #   - entity_id: weather.home
  #     label: Weather
  #   - entity_id: sensor.outdoor_temperature
  #     label: Outside
  #     unit: "°C"
  entities: []
  # Profiles replace the built-in pages for assigned devices. Each page accepts
  # up to four entity IDs. Dashboard Studio can edit these visually after the
  # first App start. Set auto_rotate_seconds to 0 to disable rotation.
  profiles:
    default:
      auto_rotate_seconds: 0
      pages:
        - title: Overview
          layout: rows
          entities:
            - entity_id: sensor.outdoor_temperature
              label: Outside
              unit: "°C"
              icon: temperature
              style: value
            - entity_id: sensor.home_battery
              label: Home Battery
              unit: "%"
              icon: battery
              style: gauge
              minimum: 0
              maximum: 100
        - title: Energy
          layout: rows
          activation:
            type: schedule
            start: "06:00"
            end: "22:00"
          entities:
            - entity_id: sensor.solar_power
              label: Solar
              unit: kW
              icon: solar
              style: value
            - entity_id: sensor.site_power
              label: Site
              unit: kW
              icon: power
              style: history
        - title: Door Alert
          layout: single
          activation:
            type: condition
            entity_id: binary_sensor.front_door
            operator: "on"
            priority: 90
            expires_after_seconds: 300
          entities:
            - entity_id: binary_sensor.front_door
              label: Front Door
              icon: alert
              style: value
        # Image tiles can instead reference a camera/image entity:
        # - title: Camera
        #   layout: single
        #   entities:
        #     - entity_id: camera.front_door
        #       label: Front Door
        #       style: image
        #       image_fit: cover
        # Or use a URL reachable from the Bridge:
        #     - entity_id: image_url.showroom
        #       label: Showroom
        #       style: image
        #       image_url: https://example.test/showroom.jpg
        #       image_fit: contain

devices:
  X4-DEMO01:
    name: Example X4
    area: Office
    model: X4
    width: 480
    height: 800
    refresh_interval_seconds: 300
    live_mode: false
    manual_sleep_seconds: 900
    profile: default
    mode: home_assistant
    auto_start: true
    intelligent_sleep: true
    active_start: "06:00"
    active_end: "22:00"
    timezone: Australia/Melbourne
    critical_battery_percent: 15
    low_battery_percent: 35
    low_battery_multiplier: 4
    unchanged_image_multiplier: 2
    stay_awake_on_usb: true
    manual_wake_grace_seconds: 60
