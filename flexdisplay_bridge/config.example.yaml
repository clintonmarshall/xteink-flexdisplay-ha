server:
  # Set FLEXDISPLAY_BRIDGE_API_KEY to protect command endpoints.
  api_key_env: FLEXDISPLAY_BRIDGE_API_KEY

storage:
  state_path: /data/flexdisplay-state.json

home_assistant:
  base_url: http://homeassistant.local:8123
  token_env: FLEXDISPLAY_HA_TOKEN
  verify_tls: false
  timeout_seconds: 10

mqtt:
  # Enable after the bridge can render a screen successfully.
  enabled: false
  host: core-mosquitto
  port: 1883
  username: flexdisplay
  password_env: FLEXDISPLAY_MQTT_PASSWORD
  discovery_prefix: homeassistant
  topic_prefix: flexdisplay

firmware:
  # Application image used by queued Home Assistant OTA installs.
  version: ""
  url: ""
  sha256: ""
  size: 0
  minimum_battery_percent: 40

dashboard:
  title: HOME ASSISTANT
  default_profile: default
  # Add entity IDs that exist in your Home Assistant. For example:
  # entities:
  #   - entity_id: weather.home
  #     label: Weather
  #   - entity_id: sensor.outdoor_temperature
  #     label: Outside
  #     unit: "°C"
  entities: []
  # Profiles replace the built-in pages for assigned devices. Each page accepts
  # up to four entity IDs. Set auto_rotate_seconds to 0 to disable rotation.
  profiles:
    default:
      auto_rotate_seconds: 0
      pages:
        - title: Overview
          entities:
            - entity_id: sensor.outdoor_temperature
              label: Outside
              unit: "°C"
            - entity_id: sensor.home_battery
              label: Home Battery
              unit: "%"
        - title: Energy
          entities:
            - entity_id: sensor.solar_power
              label: Solar
              unit: kW
            - entity_id: sensor.site_power
              label: Site
              unit: kW

devices:
  X4-DEMO01:
    name: Example X4
    model: X4
    width: 480
    height: 800
    refresh_interval_seconds: 300
    profile: default
