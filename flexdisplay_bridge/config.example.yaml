server:
  # Set FLEXDISPLAY_BRIDGE_API_KEY to protect command endpoints.
  api_key_env: FLEXDISPLAY_BRIDGE_API_KEY

storage:
  state_path: /data/flexdisplay-state.json

provisioning:
  enabled: true
  default_area: ""
  default_mode: home_assistant
  auto_start: true
  refresh_interval_seconds: 900
  live_mode: false
  manual_sleep_seconds: 900
  intelligent_sleep: true
  active_start: "06:00"
  active_end: "22:00"
  timezone: Australia/Melbourne
  critical_battery_percent: 15
  low_battery_percent: 35
  low_battery_multiplier: 4
  unchanged_image_multiplier: 2
  stay_awake_on_usb: true
  manual_wake_grace_seconds: 60

home_assistant:
  base_url: http://homeassistant.local:8123
  token_env: FLEXDISPLAY_HA_TOKEN
  verify_tls: false
  timeout_seconds: 10

mqtt:
  # Enable after the bridge can render a screen successfully.
  enabled: false
  host: core-mosquitto
  port: 1883
  username: flexdisplay
  password_env: FLEXDISPLAY_MQTT_PASSWORD
  discovery_prefix: homeassistant
  topic_prefix: flexdisplay

firmware:
  # Application image used by queued Home Assistant OTA installs.
  version: ""
  url: ""
  sha256: ""
  size: 0
  minimum_battery_percent: 40
  canary_required: true
  require_usb_for_canary: true
  max_parallel: 1

dashboard:
  title: HOME ASSISTANT
  default_profile: default
  # Add entity IDs that exist in your Home Assistant. For example:
  # entities:
  #   - entity_id: weather.home
  #     label: Weather
  #   - entity_id: sensor.outdoor_temperature
  #     label: Outside
  #     unit: "°C"
  entities: []
  # Profiles replace the built-in pages for assigned devices. Each page accepts
  # up to four entity IDs. Dashboard Studio can edit these visually after the
  # first App start. Set auto_rotate_seconds to 0 to disable rotation.
  profiles:
    default:
      auto_rotate_seconds: 0
      pages:
        - title: Overview
          layout: rows
          entities:
            - entity_id: sensor.outdoor_temperature
              label: Outside
              unit: "°C"
              icon: temperature
              style: value
            - entity_id: sensor.home_battery
              label: Home Battery
              unit: "%"
              icon: battery
              style: gauge
              minimum: 0
              maximum: 100
        - title: Energy
          layout: rows
          entities:
            - entity_id: sensor.solar_power
              label: Solar
              unit: kW
              icon: solar
              style: value
            - entity_id: sensor.site_power
              label: Site
              unit: kW
              icon: power
              style: history

devices:
  X4-DEMO01:
    name: Example X4
    area: Office
    model: X4
    width: 480
    height: 800
    refresh_interval_seconds: 300
    live_mode: false
    manual_sleep_seconds: 900
    profile: default
    mode: home_assistant
    auto_start: true
    intelligent_sleep: true
    active_start: "06:00"
    active_end: "22:00"
    timezone: Australia/Melbourne
    critical_battery_percent: 15
    low_battery_percent: 35
    low_battery_multiplier: 4
    unchanged_image_multiplier: 2
    stay_awake_on_usb: true
    manual_wake_grace_seconds: 60
