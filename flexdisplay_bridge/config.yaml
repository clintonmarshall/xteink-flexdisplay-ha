name: FlexDisplay Bridge
version: "0.17.0"
slug: flexdisplay_bridge
description: Render Home Assistant dashboards and manage XTEINK X3/X4 FlexDisplay devices
url: https://github.com/clintonmarshall/xteink-flexdisplay
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
ingress_entry: studio/
panel_icon: mdi:view-dashboard-edit
panel_title: FlexDisplay Studio
webui: http://[HOST]:[PORT:8099]/studio/
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: FlexDisplay image and management API
map:
  - addon_config:rw
options:
  dashboard_title: HOME ASSISTANT
  mqtt_enabled: false
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: flexdisplay
  mqtt_password: ""
  bridge_api_key: ""
  firmware_version: 1.4.1-flexdisplay.0.17.0
  firmware_url: https://github.com/clintonmarshall/xteink-flexdisplay-ha/releases/download/firmware-v0.17.0/firmware.bin
  firmware_sha256: 3f2912d4d2811442353ffba6fb2019167c6e0e600a04a0f176ffebae600a46ab
  firmware_size: 5486384
  firmware_minimum_battery: 40
  firmware_canary_required: true
  firmware_require_usb_for_canary: true
  firmware_max_parallel: 1
schema:
  dashboard_title: str
  mqtt_enabled: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  bridge_api_key: password
  firmware_version: str
  firmware_url: str
  firmware_sha256: str
  firmware_size: int
  firmware_minimum_battery: int(20,100)
  firmware_canary_required: bool
  firmware_require_usb_for_canary: bool
  firmware_max_parallel: int(1,10)
