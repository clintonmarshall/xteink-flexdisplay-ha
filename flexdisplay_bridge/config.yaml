name: FlexDisplay Bridge
version: "0.23.0"
slug: flexdisplay_bridge
description: Render Home Assistant dashboards and manage XTEINK X3/X4 FlexDisplay devices
url: https://github.com/clintonmarshall/xteink-flexdisplay
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
ingress_entry: studio/
panel_icon: mdi:view-dashboard-edit
panel_title: FlexDisplay Studio
webui: http://[HOST]:[PORT:8099]/studio/
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: FlexDisplay image and management API
map:
  - addon_config:rw
options:
  dashboard_title: HOME ASSISTANT
  mqtt_enabled: false
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: flexdisplay
  mqtt_password: ""
  home_assistant_entity_source: hacs
  screen_history_enabled: true
  screen_history_limit: 5
  bridge_api_key: ""
  firmware_version: 1.4.1-flexdisplay.0.23.0
  firmware_url: https://github.com/clintonmarshall/xteink-flexdisplay-ha/releases/download/firmware-v0.23.0/firmware.bin
  firmware_sha256: cb16136e09512b2cb58ab51db6ff381afb2f98c41fdd45e97665650a67decc5f
  firmware_size: 5512016
  firmware_minimum_battery: 40
  firmware_canary_required: true
  firmware_require_usb_for_canary: true
  firmware_max_parallel: 1
  firmware_retry_limit: 3
  firmware_retry_backoff_seconds: 300
  firmware_mirror_enabled: true
  firmware_mirror_retry_seconds: 300
  firmware_stale_install_seconds: 1800
schema:
  dashboard_title: str
  mqtt_enabled: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  home_assistant_entity_source: list(hacs|mqtt|both)
  screen_history_enabled: bool
  screen_history_limit: int(1,20)
  bridge_api_key: password
  firmware_version: str
  firmware_url: str
  firmware_sha256: str
  firmware_size: int
  firmware_minimum_battery: int(20,100)
  firmware_canary_required: bool
  firmware_require_usb_for_canary: bool
  firmware_max_parallel: int(1,10)
  firmware_retry_limit: int(0,10)
  firmware_retry_backoff_seconds: int(0,86400)
  firmware_mirror_enabled: bool
  firmware_mirror_retry_seconds: int(30,86400)
  firmware_stale_install_seconds: int(300,86400)
