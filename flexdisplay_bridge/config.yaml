name: FlexDisplay Bridge
version: "0.5.0"
slug: flexdisplay_bridge
description: Render Home Assistant dashboards and manage XTEINK X3/X4 FlexDisplay devices
url: https://github.com/clintonmarshall/xteink-flexdisplay
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: FlexDisplay image and management API
map:
  - addon_config:rw
options:
  dashboard_title: HOME ASSISTANT
  mqtt_enabled: false
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: flexdisplay
  mqtt_password: ""
  bridge_api_key: ""
  firmware_version: 1.4.1-flexdisplay.0.7.0
  firmware_url: https://github.com/clintonmarshall/xteink-flexdisplay-ha/releases/download/v0.3.0/firmware.bin
  firmware_sha256: 18082f56b8150d068d4cf71d9783fd1f070c35aea3777a455d9dcc0184caebf0
  firmware_size: 5472064
  firmware_minimum_battery: 40
schema:
  dashboard_title: str
  mqtt_enabled: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  bridge_api_key: password
  firmware_version: str
  firmware_url: str
  firmware_sha256: str
  firmware_size: int
  firmware_minimum_battery: int(20,100)
